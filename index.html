<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카더라 게시판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- 구글 번역 위젯 -->
    <div id="google_translate_element" class="lang-selector"></div>

    <!-- 큰 제목 -->
    <h1>카더라</h1>

    <!-- 탭 메뉴 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('interview')">인터뷰 보기</button>
      <button class="tab-btn" onclick="switchTab('rumor')">카더라에 대하여</button>
      <button class="tab-btn" onclick="switchTab('request')">듣고 싶은 이야기</button>
    </div>

    <!-- 검색 영역 (인터뷰 탭에서만 사용) -->
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="검색어를 입력하세요...">
      <button class="btn-primary" id="searchBtn">검색</button>
    </div>

    <!-- 목록 및 내용 영역 -->
    <div id="results"></div>
  </div>

  <!-- 플로팅 글쓰기/관리자 인증 버튼 (+) -->
  <button class="fab-btn" id="openModalBtn">+</button>

  <!-- 관리자 인증 및 글 작성 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeModalBtn">&times;</button>
      
      <!-- 관리자 인증 단계 -->
      <div id="authStep">
        <h3>관리자 인증</h3>
        <input type="password" id="adminPassword" placeholder="관리자 비밀번호">
        <button class="btn-primary" id="authBtn" style="width: 100%;">인증</button>
      </div>

      <!-- 새 글 작성 단계 -->
      <div id="writeStep" style="display: none;">
        <h3>새 글 작성</h3>
        <select id="writeCategory">
          <option value="interview">인터뷰</option>
          <option value="rumor">카더라</option>
        </select>
        <input type="text" id="writeTitle" placeholder="제목">
        <textarea id="writeContent" placeholder="내용"></textarea>
        <button class="btn-primary" id="submitBtn" style="width: 100%;">등록</button>
      </div>
    </div>
  </div>

  <!-- 구글 번역 스크립트 -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ko',
        includedLanguages: 'ko,en,ja,zh-CN',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- 메인 비즈니스 로직 스크립트 (외부 파일 연결) -->
  <script src="script.js"></script>
</body>
</html>
